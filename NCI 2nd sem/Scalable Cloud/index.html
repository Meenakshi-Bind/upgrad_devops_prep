<!DOCTYPE html>
<html>
<head>
  <title>Password Strength Checker</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 80px;
    }

    input {
      padding: 10px;
      width: 300px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
      color: green;
    }
  </style>
</head>

<body>

  <h2>Password Strength Checker</h2>

  <input type="password" id="password" placeholder="Enter your password">
  <br>

  <button onclick="checkPassword()">Check Strength</button>

  <div id="result"></div>

  <script>
    async function checkPassword() {

      const password = document.getElementById("password").value;

      const response = await fetch("https://aljoyd5gl3.execute-api.us-east-1.amazonaws.com/check", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ password: password })
      });

      const data = await response.json();

      document.getElementById("result").innerHTML =
        "Strength: " + data.strength + "<br>Score: " + data.score;
    }
  </script>

</body>
</html>
