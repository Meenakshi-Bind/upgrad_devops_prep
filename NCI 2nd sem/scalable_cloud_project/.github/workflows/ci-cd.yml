name: Deploy Django to Elastic Beanstalk + Code Quality & Security Scans

on:
  push:
    branches:
      - main

jobs:

  # =============================
  # Job 1: Setup and Dependencies
  # =============================
  setup:
    name: Stage 1:Setup and Install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install awsebcli

      - name: Add EB CLI to PATH
        run: |
          export PATH="$PATH:$(python -m site --user-base)/bin"
          echo "EB CLI version:"
          eb --version


  # =============================
  # Job 2: Testing + Code Quality
  # =============================
  test:
    name: Stage 2:Tests and Code Quality
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings --cov=. --cov-report=xml:coverage.xml || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Meenakshi-NCI_Scalable_Cloud_Project
            -Dsonar.organization=meenakshi-nci
            -Dsonar.sources=parking
            -Dsonar.exclusions=**/migrations/**,**/venv/**
            -Dsonar.python.coverage.reportPaths=coverage.xml


  # =============================
  # Job 3: Deploy to AWS EB
  # =============================
  deploy:
    name: Stage 3:Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: test
    outputs:
      eb_cname: ${{ steps.deploy-eb.outputs.eb_cname }}   # Job output

    env:
      EB_APP_NAME: parking-track
      EB_ENV_NAME: parking-application
      REGION: us-east-1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.REGION }}
     
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install awsebcli

      - name: Add EB CLI to PATH
        run: |
          export PATH="$PATH:$(python -m site --user-base)/bin"
          echo "EB CLI version:"
          eb --version


      - name: Deploy to Elastic Beanstalk
        id: deploy-eb
        run: |
          export PATH="$PATH:$(python -m site --user-base)/bin"
          hash -r

          aws elasticbeanstalk describe-applications --application-names "parking-application" || \
          aws elasticbeanstalk create-application --application-name "parking-application"

          eb init "$EB_APP_NAME" --region "$REGION" --platform "Python 3.11" --quiet

          ENV_EXISTS=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APP_NAME" \
            --environment-names "$EB_ENV_NAME" \
            --query 'Environments[0].EnvironmentName' \
            --output text)

          if [ -z "$ENV_EXISTS" ] || [ "$ENV_EXISTS" = "None" ]; then
            eb create "$EB_ENV_NAME" --platform "Python 3.11" --region "$REGION" --quiet
          fi

          eb deploy "$EB_ENV_NAME" --verbose

          CNAME=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APP_NAME" \
            --environment-names "$EB_ENV_NAME" \
            --query 'Environments[0].CNAME' \
            --output text)

          echo "eb_cname=$CNAME" >> $GITHUB_OUTPUT

