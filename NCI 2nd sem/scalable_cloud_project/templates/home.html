{% extends 'base.html' %}

{% block content %}
<div class="text-center">
    <h1 class="display-4">Welcome to Parking App</h1>
    <p class="lead">Manage your vehicle parking efficiently</p>
    
    {% if not user.is_authenticated %}
    <div class="mt-5">
        <a href="{% url 'login' %}" class="btn btn-primary btn-lg me-3">Login</a>
        <a href="{% url 'register' %}" class="btn btn-success btn-lg">Register</a>
    </div>
    {% else %}
    <div class="mt-5">
        <a href="{% url 'dashboard' %}" class="btn btn-primary btn-lg">Go to Dashboard</a>
    </div>
    {% endif %}
</div>
{% endblock %}
