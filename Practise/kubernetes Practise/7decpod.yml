apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
spec:
  replicas: 8
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      name: vote
      labels: 
        app: vote
    spec:
      containers:
        - name: vote
          image: dipesh017/demo:vote
          resources:
            requests:
              memory: "500Mi"
              cpu: ".5"
            limits:
              memory: "1Gi"
              cpu: "1"