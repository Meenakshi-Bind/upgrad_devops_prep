apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: aws-ebs
provisioner: kubernetes.io/aws-ebs
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
replicas: 2
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  targetCPU: "60"
  targetMemory: ""

service:
  enabled: true
  type: LoadBalancer
persistence:
  type: pvc
  enabled: true
  storageClassName: aws-ebs
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  
adminUser: admin
adminPassword: strongpassword

