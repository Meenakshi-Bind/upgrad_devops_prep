<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>EPIK Parking Management</title>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-form">
            <h2>Valet Parking System</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
            <div id="loginMessage" class="message"></div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="mainApp" class="block" style="display: none;">
        <div class="header">
            <h2>Valet Parking Management</h2>
            <button class="sign_out" id="signOutBtn">
                <i class="fas fa-power-off"></i> Sign Out
            </button>
        </div>
        
        <div class="second_level">
            <input type="text" id="searchInput" class="input_value" 
                   placeholder="Search for Vehicle No.." title="Type in a name">
            <button class="addContent" id="checkInBtn">
                <i class="fas fa-plus"></i> Check In
            </button>
        </div>
        
        <div class="divider"></div>
        
        <div class="table-container">
            <table class="vehicleShow">
                <thead>
                    <tr>
                        <th>Vehicle No</th>
                        <th>Vehicle Model</th>
                        <th>Vehicle Type</th>
                        <th>Phone</th>
                        <th>Check-in Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="vehicleTableBody" class="table">
                    <!-- Vehicles will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Check-in Popup -->
    <div id="checkInPopup" class="popCheckIn" style='display: none;'>
        <h2 class="head">Vehicle Check-in</h2>
        <div class="carInfo">
            <form id="vehicleForm">
                <div class="form-field">
                    <label for="VehicleNo">Vehicle Number *</label>
                    <input type="text" name="VehicleNo" id="VehicleNo" placeholder="TN 09 CD 2721" required />
                </div>
                <div class="form-field">
                    <label for="VehicleType">Vehicle Type *</label>
                    <select name="VehicleType" id="VehicleType" required>
                        <option value="">Select Type</option>
                        <option value="2">2 Wheeler</option>
                        <option value="4">4 Wheeler</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="VehicleModel">Vehicle Model *</label>
                    <input type="text" name="VehicleModel" id="VehicleModel" required placeholder="AUDI" />
                </div>
                <div class="form-field">
                    <label for="Phoneno">Phone Number *</label>
                    <input type="tel" name="Phoneno" id="Phoneno" placeholder="1234567890" required />
                </div>
                <div class="form-field">
                    <label for="CustomerName">Customer Name *</label>
                    <input type="text" name="CustomerName" id="CustomerName" placeholder="Your name" required />
                </div>
                <div class="form-actions">
                    <button type="button" id="cancelCheckIn" class="cancel-btn">Cancel</button>
                    <button type="submit" class="submit">Check-in</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Checkout Popup -->
    <div id="checkoutPopup" class="afterCheckOut" style='display: none;'>
        <div class="checkout-content">
            <h2 class="CheckOOO">Checkout Details</h2>
            <div class="checkout-details">
                <div class="detail-section">
                    <h3>Customer Information</h3>
                    <div id="customerDetails"></div>
                </div>
                <div class="detail-section">
                    <h3>Parking Information</h3>
                    <div id="parkingDetails"></div>
                </div>
            </div>
            <div class="Payment">
                <p>Total Amount</p>
                <h3 id="totalAmount">Rs 0</h3>
                <button class="Pro" id="proceedPayment">Proceed To Pay</button>
            </div>
        </div>
    </div>

    <!-- Payment Success Popup -->
    <div id="paymentSuccess" class="PaymentDone" style='display: none;'>
        <div class="successful">
            <i class="fas fa-check-circle success-icon"></i>
            <span class="A">Payment Successful!</span>
            <span class="b">Your vehicle will be delivered within 5 minutes</span>
            <button class="closeButton" id="closeSuccess">Close</button>
        </div>
    </div>

    <script src="scriptdb.js"></script>
    <script src="script.js"></script>
</body>
</html>
